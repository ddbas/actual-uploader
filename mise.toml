#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
lockfile = true

[hooks]
enter = "mise exec -- lefthook install"

[tasks.build]
description = "Build the project"
run = "pnpm build"

[tasks.dev]
description = "Run dev processes in parallel"
run = "pnpm dev"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.test]
description = "Run tests"
run = "pnpm test"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
pnpm = "11.20.0"
