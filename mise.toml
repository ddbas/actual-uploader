#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
lockfile = true

[hooks]
enter = "mise exec -- lefthook install"

[tasks.build]
description = "Build the project"
run = "mise exec -- pnpm build"

[tasks.dev]
description = "Run dev processes in parallel"
run = "mise exec -- pnpm dev"

[tasks."docker:build"]
description = "Build the server Docker image"
run = "docker build -f apps/server/Dockerfile -t account-crawler-server ."

[tasks.install]
description = "Install dependencies"
run = "mise exec -- pnpm install"

[tasks."openspec:list"]
description = "List OpenSpec proposals"
run = "mise exec -- openspec list"

[tasks.test]
description = "Run tests"
run = "mise exec -- pnpm test"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
pnpm = "11.20.0"
