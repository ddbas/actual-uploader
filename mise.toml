[hooks]
enter = [
  { task = "lefthook:install" },
  { task = "codegraph:init" }
]

[tasks."codegraph:init"]
description = "Initialize codegraph"
run = "codegraph init"
outputs = [".codegraph/codegraph.db"]

[tasks."crawler:generate"]
description = "Record a browsing session and scaffold a crawler: crawler:generate <name> <url> [--marker-key <key>]"
run = "pnpm --filter crawlers exec tsx scripts/generate-crawler.ts"

[tasks."lefthook:install"]
description = "Install lefthook"
run = "lefthook install"

[tasks."pnpm:build"]
description = "Build the project"
run = "pnpm turbo:build"

[tasks."pnpm:dev"]
description = "Run dev processes in parallel"
run = "pnpm turbo:dev"

[tasks."pnpm:install"]
description = "Install dependencies"
run = "pnpm install"

[tasks."pnpm:test"]
description = "Run tests"
run = "pnpm turbo:test"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
pnpm = "11.20.0"
