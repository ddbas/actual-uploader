#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
lockfile = true

[hooks]
enter = "mise exec -- lefthook install"

[tasks.build]
description = "Build the project"
run = "pnpm build"

[tasks."crawler:generate"]
description = "Record a browsing session and scaffold a crawler: crawler:generate <name> <url> [--marker-key <key>]"
run = "pnpm --filter crawlers exec tsx scripts/generate-crawler.ts"

[tasks.dev]
description = "Run dev processes in parallel"
run = "pnpm dev"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.test]
description = "Run tests"
run = "pnpm test"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
pnpm = "11.20.0"
