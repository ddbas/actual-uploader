pre-commit:
  parallel: true
  jobs:
    - name: build & test
      # Must be run this way as turbo needs to control the order execution (not lefthook),
      # otherwise `build` scripts that are a dependency of `test` scripts will run twice (once for `build` and once for `test`).
      run: mise exec -- pnpm dlx turbo run build test

    - name: format
      group:
        parallel: true
        jobs:
          - name: biome
            glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
            run: mise exec -- pnpm dlx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
            stage_fixed: true
          - name: markdown
            glob: "*.md"
            run: mise exec -- prettier --write {staged_files}
            stage_fixed: true

    
    - name: openspec
      glob: "openspec/**"
      run: mise exec -- openspec validate --all --no-interactive
